name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: node --test
      - run: node scripts/validate.mjs

  manifests:
    # The official manifest check, so a schema change upstream fails here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: for p in plugins/*/; do claude plugin validate --strict "$p"; done
